<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>x mock</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      #layout { display: flex; justify-content: center; }
      nav { position: sticky; top: 0; height: 100vh; width: 250px; background: #eef; }
      [data-testid='primaryColumn'] { width: 600px; border-left: 1px solid #ccc; border-right: 1px solid #ccc; }
      .hdr { position: sticky; top: 0; height: 53px; background: rgba(255, 255, 255, 0.85); z-index: 3; border-bottom: 1px solid #ddd; }
      #list { position: relative; }
      [data-testid='cellInnerDiv'] { position: absolute; left: 0; right: 0; top: 0; }
      article { display: block; box-sizing: border-box; border-bottom: 1px solid #eee; padding: 12px; }
      [data-testid='tweetPhoto'] { background: #58c; }
      .newposts { position: fixed; top: 60px; left: 50%; width: 120px; height: 30px; margin-left: -60px; background: #1d9bf0; z-index: 4; }
    </style>
  </head>
  <body>
    <div id="layout">
      <nav>nav</nav>
      <div data-testid="primaryColumn">
        <div class="hdr">Home</div>
        <div style="height: 120px">compose</div>
        <section><div id="list"></div></section>
      </div>
      <aside style="width: 300px"></aside>
    </div>
    <div class="newposts">Show 12 posts</div>
    <script>
      // Virtualised like X: cells are absolutely positioned with translateY.
      // Every 7th cell is "Who to follow" (not a post); cells with n % 3 === 1 are text-only.
      let n = 0;
      let y = 0;
      function add(count) {
        for (let i = 0; i < count; i++, n++) {
          const cell = document.createElement('div');
          cell.dataset.testid = 'cellInnerDiv';
          cell.style.transform = `translateY(${y}px)`;
          let h;
          if (n % 7 === 6) {
            h = 200;
            cell.innerHTML = `<div style="height:${h}px">Who to follow</div>`;
          } else {
            const media = n % 3 !== 1;
            h = media ? 300 + ((n * 61) % 300) : 120;
            cell.innerHTML = `<article id="t${n}" data-testid="tweet" style="height:${h}px">tweet ${n}${
              media ? `<div data-testid="tweetPhoto" style="height:${h - 80}px">${
                n === 3 ? '<div data-testid="videoPlayer"><button data-testid="playButton" aria-label="Play">▶</button></div>' : ''
              }</div>` : ''
            }${n === 2 ? '<video src="https://media.test/clip.webm" preload="auto" style="height:40px"></video>' : ''}<button data-testid="like">♥</button><button data-testid="bookmark">🔖</button></article>`;
          }
          list.append(cell);
          y += h;
        }
        list.style.height = y + 'px';
      }
      document.addEventListener('click', (e) => {
        const play = e.target.closest?.('[data-testid="playButton"]');
        if (play) {
          const v = Object.assign(document.createElement('video'), { src: 'https://media.test/clip.webm', muted: true });
          play.replaceWith(v);
          v.play();
          return;
        }
        // Clicking a video goes to the post's own page (like X); a photo opens the viewer dialog.
        if (e.target.closest?.('[data-testid="tweetPhoto"]')?.querySelector('[data-testid="videoPlayer"]')) {
          location.hash = 'status';
          return;
        }
        if (e.target.closest?.('[data-testid="tweetPhoto"]') && !document.getElementById('viewer')) {
          const d = document.createElement('div');
          d.id = 'viewer';
          d.setAttribute('role', 'dialog');
          d.setAttribute('aria-modal', 'true');
          d.dataset.slide = '0';
          d.style.cssText = 'position:fixed;inset:0;z-index:20;background:#000c';
          d.innerHTML = '<button aria-label="Close">x</button><button aria-label="Previous slide">&lt;</button><button aria-label="Next slide">&gt;</button>';
          const [close, prev, next] = d.querySelectorAll('button');
          close.onclick = () => d.remove();
          prev.onclick = () => (d.dataset.slide = String(Math.max(0, +d.dataset.slide - 1)));
          next.onclick = () => (d.dataset.slide = String(Math.min(3, +d.dataset.slide + 1)));
          document.body.append(d);
          return;
        }
        const b = e.target.closest?.('button[data-testid]');
        const swap = { like: 'unlike', unlike: 'like', bookmark: 'removeBookmark', removeBookmark: 'bookmark' };
        if (b && swap[b.dataset.testid]) b.dataset.testid = swap[b.dataset.testid];
      });
      add(20);
      addEventListener('scroll', () => {
        if (n < 60 && scrollY + innerHeight > document.documentElement.scrollHeight - 200) add(10);
      });
    </script>
  </body>
</html>
